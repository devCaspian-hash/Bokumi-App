<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="48" viewBox="0 0 1280 48">
<style>
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.tw{opacity:.15;transform-box:fill-box;transform-origin:center;animation:tw 3.6s ease-in-out infinite backwards}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.pg{transform-box:fill-box;transform-origin:center;animation:bob 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:1}}
.breathe{animation:breathe 6s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-520px)}38%,100%{transform:translateX(1900px)}}
.sweep{animation:sweep 9s cubic-bezier(.4,0,.2,1) infinite}
@keyframes hl{0%,100%{stroke-opacity:0;fill-opacity:0}6%,20%{stroke-opacity:.9;fill-opacity:.09}32%{stroke-opacity:0;fill-opacity:0}}
.hl{fill-opacity:0;stroke-opacity:0;animation:hl 8s ease-in-out infinite backwards}
@keyframes ring{0%{transform:scale(1);opacity:.75}70%,100%{transform:scale(1.5,1.8);opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.4s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.55}100%{transform:translateY(-320px);opacity:0}}
.dust{opacity:0;animation:rise 11s linear infinite backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes run{0%{transform:translateX(0)}100%{transform:translateX(1280px)}}
.run{animation:run 5.2s cubic-bezier(.45,0,.55,1) infinite}</style>
<defs><linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#D4A6FA" stop-opacity="0"/><stop offset=".5" stop-color="#D4A6FA" stop-opacity=".5"/><stop offset="1" stop-color="#D4A6FA" stop-opacity="0"/></linearGradient>
<linearGradient id="spark" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="lane"><rect x="140" y="0" width="1000" height="48"/></clipPath></defs>
<rect x="140" y="23.25" width="1000" height="1.5" fill="url(#line)"/>
<g clip-path="url(#lane)"><rect class="run" x="-200" y="22.5" width="200" height="3" rx="1.5" fill="url(#spark)"/></g>
<path class="tw" style="animation-delay:0.0s" d="M640 14 Q640 24 650 24 Q640 24 640 34 Q640 24 630 24 Q640 24 640 14Z" fill="#D4A6FA"/><path class="tw" style="animation-delay:1.1s" d="M560 12 Q560 17 565 17 Q560 17 560 22 Q560 17 555 17 Q560 17 560 12Z" fill="#fff"/><path class="tw" style="animation-delay:2.0s" d="M722 26 Q722 31 727 31 Q722 31 722 36 Q722 31 717 31 Q722 31 722 26Z" fill="#fff"/><path class="tw" style="animation-delay:0.6s" d="M470 26.5 Q470 30 473.5 30 Q470 30 470 33.5 Q470 30 466.5 30 Q470 30 470 26.5Z" fill="#D4A6FA"/><path class="tw" style="animation-delay:1.7s" d="M812 14.5 Q812 18 815.5 18 Q812 18 812 21.5 Q812 18 808.5 18 Q812 18 812 14.5Z" fill="#D4A6FA"/></svg>