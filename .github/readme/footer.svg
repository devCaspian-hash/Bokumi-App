  </defs><style>@font-face{font-family:'Bokumi Serif';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Bokumi JP';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Bokumi Sans';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes pulse{0%,100%{opacity:.05}50%{opacity:.13}}
.sl{animation:pulse 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.tw,.float,.eye,.sl{animation:none}}
